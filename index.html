const euro=n=>Number(n).toFixed(2).replace('.',',')+' €';
const pct=n=>(n>0?'+':'')+Number(n).toFixed(1).replace('.',',')+' %';
const realPrice=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v))&&Number(v)>0;
const kpis=document.getElementById('kpis');
const trend=DATA.summary.priceChangePct===null?'Données insuffisantes':pct(DATA.summary.priceChangePct);
const trendClass=DATA.summary.priceChangePct===null?'':DATA.summary.priceChangePct>0.05?'up':DATA.summary.priceChangePct<-0.05?'down':'';
const best=DATA.summary.bestPrice?euro(DATA.summary.bestPrice.price):'N/D';
const bestSub=DATA.summary.bestPrice?DATA.summary.bestPrice.store+' · '+DATA.summary.bestPrice.product:'Aucun prix exploitable';
kpis.innerHTML=[
  ['Produits disponibles',DATA.summary.availableProducts+' / '+DATA.summary.totalProducts,'État confirmé actuellement',''],
  ['Prix moyen',DATA.summary.currentAverage===null?'N/D':euro(DATA.summary.currentAverage),'Dernier prix connu par produit',''],
  ['Variation 7 jours',trend,DATA.summary.comparableProducts+' produit(s) comparable(s)',trendClass],
  ['Meilleur prix',best,bestSub,'down']
].map(x=>'<div class="kpi"><div class="label">'+x[0]+'</div><div class="value '+x[3]+'">'+x[1]+'</div><div class="muted">'+x[2]+'</div></div>').join('');

const grouped={};for(const p of DATA.latest){(grouped[p.store]??=[]).push(p)}
const root=document.getElementById('stores');
for(const [store,products] of Object.entries(grouped)){const el=document.createElement('section');el.className='card';el.innerHTML='<h2>'+store+'</h2>'+products.map(p=>{const cls=p.status==='InStock'?'in':p.status==='OutOfStock'?'out':'unknown';const label=p.status==='InStock'?'EN STOCK':p.status==='OutOfStock'?'RUPTURE':'INCONNU';const price=realPrice(p.price)?euro(p.price):'prix N/D';return '<div class="product"><strong>'+p.product+'</strong><br><span class="'+cls+'">● '+label+'</span> · '+price+'<br><span class="muted">'+p.localDate+' '+String(p.localTime||'').slice(0,5)+'</span> · <a href="'+p.url+'" target="_blank" rel="noopener">ouvrir le produit</a></div>'}).join('');root.appendChild(el)}

const storeRestocks=document.getElementById('storeRestocks');
storeRestocks.innerHTML=DATA.storeRestockStats.map(s=>{if(!s.topDay)return '<div class="restock-row"><div><div class="restock-main">🏪 '+s.store+'</div><div class="muted">Aucun retour en stock encore observé</div></div><div class="right"><span class="badge">Confiance insuffisante</span></div></div>';const day=s.topDay.value.charAt(0).toUpperCase()+s.topDay.value.slice(1);const hour=s.topHour?' · vers '+String(s.topHour.value).padStart(2,'0')+'h':'';return '<div class="restock-row"><div><div class="restock-main">🏪 '+s.store+' — '+day+hour+'</div><div class="muted">'+s.count+' retour(s) observé(s) · jour dominant observé '+s.topDay.count+' fois</div></div><div class="right"><span class="badge">Confiance '+s.confidence.toLowerCase()+'</span></div></div>'}).join('');

const priceKeys=[...new Set(DATA.priceSeries.map(x=>x.key))];const priceLabels=[...new Set(DATA.priceSeries.map(x=>x.label))];
const priceDatasets=priceKeys.map(key=>({label:key,data:priceLabels.map(label=>{const points=DATA.priceSeries.filter(x=>x.key===key&&x.label===label);return points.length?points[points.length-1].price:null}),spanGaps:true,tension:.2}));
new Chart(document.getElementById('priceChart'),{type:'line',data:{labels:priceLabels,datasets:priceDatasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},scales:{y:{ticks:{callback:v=>String(v).replace('.',',')+' €'}}}}});
new Chart(document.getElementById('dayChart'),{type:'bar',data:{labels:DATA.restockByDay.map(x=>x.day),datasets:[{label:'Retours en stock',data:DATA.restockByDay.map(x=>x.count)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
new Chart(document.getElementById('hourChart'),{type:'bar',data:{labels:DATA.restockByHour.map(x=>x.hour+'h'),datasets:[{label:'Retours en stock',data:DATA.restockByHour.map(x=>x.count)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
const rest=document.getElementById('restocks');if(!DATA.restocks.length)rest.innerHTML='<p class="empty">Aucun retour en stock encore observé. Les statistiques se construiront automatiquement.</p>';else{rest.innerHTML='<table><thead><tr><th>Date</th><th>Magasin</th><th>Produit</th><th>Prix</th></tr></thead><tbody>'+DATA.restocks.slice().reverse().slice(0,30).map(r=>'<tr><td>'+r.localDate+' '+String(r.localTime||'').slice(0,5)+'</td><td>'+r.store+'</td><td><a href="'+r.url+'" target="_blank" rel="noopener">'+r.product+'</a></td><td>'+(realPrice(r.price)?euro(r.price):'N/D')+'</td></tr>').join('')+'</tbody></table>'}
